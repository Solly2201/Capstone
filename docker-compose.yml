services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/cap
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-change-before-production
      WEB_ORIGIN: http://localhost:5173
      AI_SERVICE_URL: http://ai:8000
      LOCAL_STORAGE_ROOT: /data/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: ./services/ai
    volumes:
      # data/index and data/legal-corpus are build artifacts (gitignored,
      # rebuilt by scripts/ingest_corpus.py), so they are mounted rather
      # than baked into the image.
      - ./services/ai/data:/app/data:ro
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  uploads_data:
